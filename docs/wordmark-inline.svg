<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 132" role="img" aria-label="minim">
<defs>
  <!-- gradient and clip are in the mirrored text's own coordinates: its baseline (local y=62) lands at screen y=70 -->
  <linearGradient id="fade" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="var(--accent)" stop-opacity="0.4"/><stop offset="0.7" stop-color="var(--accent)" stop-opacity="0"/></linearGradient>
  <clipPath id="under"><rect x="0" y="34" width="480" height="30"/></clipPath>
</defs>
<text x="240" y="62" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="64" font-weight="700" letter-spacing="2" text-anchor="middle" fill="var(--ink)">minim</text>
<text x="240" y="62" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="64" font-weight="700" letter-spacing="2" text-anchor="middle" fill="url(#fade)" clip-path="url(#under)" transform="translate(0,132) scale(1,-1)">minim</text>
<text x="240" y="118" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="3" text-anchor="middle" fill="var(--muted)">READS THE SAME BACKWARDS · 1.2 KB GZIPPED</text>
</svg>
