<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minim example</title>
  <style>
    body { font: 16px/1.5 system-ui, sans-serif; max-width: 900px; margin: 2rem auto; padding: 0 1rem; }
    section { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 1.5rem; }
    label { display: block; margin: .5rem 0; }
    dd::before { content: 'app.' attr(data-watch) ' = '; color: #888; }
    button { margin: .2rem; }
    [data-todo] { padding: .25rem .5rem; border-left: 3px solid #4a7; margin: .25rem 0; }
  </style>

  <!-- 1. State is plain JSON in the page. From PHP: <?= json_encode($state, JSON_HEX_TAG|JSON_HEX_AMP) ?> -->
  <script type="application/json" data-state="app" data-root="root">
    { "name": "", "showName": false, "text": "fruit salad", "favorites": "🥥 🍓 🍍",
      "number": 22, "largest": 23, "smallest": 11, "count": 0,
      "user": { "city": "Punta Gorda" }, "todos": ["ship v3"] }
  </script>
</head>
<body>
<main id="root">
  <h2><a href="https://github.com/hertonwork/minim">Minim</a></h2>
  <section>
    <article>
      <h3>Models</h3>
      <label>Name <input data-model="name"></label>
      <label>Favorites <input data-model="favorites"></label>
      <label>Text <input data-model="text"></label>
      <label>Number (bounded by min/max) <input type="number" data-model="number" data-bind="min:smallest max:largest"></label>
      <label>Min <input type="number" data-model="smallest" data-bind="max:largest"></label>
      <label>Max <input type="number" data-model="largest" data-bind="min:smallest"></label>
      <label><input type="checkbox" data-model="showName"> show name</label>
      <label>City (nested path) <input data-model="user.city"></label>
    </article>

    <article>
      <h3>Views</h3>
      <dl>
        <dt>Text</dt><dd data-watch="text"></dd><dd data-watch="favorites"></dd>
        <dt>Numbers</dt><dd data-watch="number"></dd><dd data-watch="largest"></dd><dd data-watch="smallest"></dd>
        <dt>Nested</dt><dd data-watch="user.city"></dd>
        <dt>Count</dt><dd data-watch="count"></dd>
      </dl>
      <p data-show="showName">Hello, <strong data-watch="name"></strong>!</p>
    </article>

    <article>
      <h3>Zero-JS actions (Invoker Commands)</h3>
      <!-- Buttons declare what they do. No addEventListener on the page. -->
      <button type="button" commandfor="root" command="--inc" value="count">count +1</button>
      <button type="button" commandfor="root" command="--inc" value="count" data-step="-1">count −1</button>
      <button type="button" commandfor="root" command="--toggle" value="showName">toggle name</button>
      <button type="button" commandfor="root" command="--set" data-key="text" value="tiramisu">text = tiramisu</button>
      <button type="button" commandfor="root" command="--push" data-key="todos" value="write docs">add todo</button>
      <p>Todos: <span data-watch="todos.length"></span></p>

      <h3>Late DOM</h3>
      <p>Markup inserted after load (fetch / htmx / PHP fragment) binds itself:</p>
      <div id="late"></div>
      <button type="button" id="inject">inject a bound element</button>
      <button type="button" id="remove">remove it</button>
    </article>
  </section>
</main>

<!-- 2. One tag. Everything above is already wired by the time this finishes evaluating. -->
<script type="module" src="./dist/index.js"></script>

<!-- Demo-only helpers for the "late DOM" buttons (simulating a fetch response) -->
<script type="module">
  document.getElementById('inject').onclick = () => {
    document.getElementById('late').insertAdjacentHTML('beforeend',
      '<p data-todo>Late element sees name = <em data-watch="name"></em></p>');
  };
  document.getElementById('remove').onclick = () => document.querySelector('[data-todo]')?.remove();
</script>
</body>
</html>
